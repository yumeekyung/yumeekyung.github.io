<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project</title>
  <link rel="stylesheet" href="css/style.css?v=editorial-20261118" />
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="./" class="logo" data-name-en></a>
      <nav aria-label="포트폴리오"><a href="./#work">← All Work</a></nav>
    </div>
  </header>

  <main class="detail">
    <section class="wrap detail-head" aria-labelledby="project-title">
      <p class="eyebrow" data-p-cat></p>
      <h1 id="project-title" data-p-title tabindex="-1"></h1>
      <p class="sub" data-p-subtitle></p>
      <div class="detail-intro">
        <p class="summary" data-p-summary></p>
        <dl class="meta">
          <div><dt>Period</dt><dd data-p-year></dd></div>
          <div><dt>Role</dt><dd data-p-role></dd></div>
          <div><dt>Tools</dt><dd data-p-tools></dd></div>
        </dl>
      </div>
    </section>

    <section class="wrap gallery" aria-label="프로젝트 이미지">
      <p class="gallery-hint">이미지를 선택하면 원본을 볼 수 있습니다.</p>
      <div class="shots"></div>
    </section>

    <nav class="wrap pager" aria-label="다른 프로젝트"></nav>
  </main>

  <footer class="wrap footer">© <span data-year></span> <span data-name-en></span></footer>

  <script src="js/data.js?v=editorial-20261118"></script>
  <script src="js/main.js?v=editorial-20261118"></script>
</body>
</html>
